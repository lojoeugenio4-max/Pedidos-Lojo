<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Cash Lojo - Tarjeta Rasca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #eef0f4;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    font-family: "Poppins", -apple-system, sans-serif;
  }

  .mesa {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.6vh;
    padding: 2vh 2vw;
    touch-action: none;
  }

  /* Tarjeta: 25% mas grande que la version anterior (40vw/76vh -> 50vw/95vh) */
  .tarjeta {
    position: relative;
    width: min(62.5vw, 119vh);
    aspect-ratio: 1429 / 789;
    background: linear-gradient(150deg, #eaf6ff 0%, #bfe3ff 45%, #7fc4fb 100%);
    border-radius: 2.2%;
    border: clamp(3px, .8vw, 10px) solid #f81a1e;
    box-shadow: 0 16px 36px rgba(0,0,0,.3);
    overflow: hidden;
  }

  .rayo { position: absolute; background: #f81a1e; opacity: .5; }
  .rayo1 { width: 42%; height: 6%; left: -8%; bottom: 8%; transform: rotate(-27deg); }
  .rayo2 { width: 30%; height: 4.5%; left: -9%; bottom: 1%; transform: rotate(-27deg); opacity: .3; }
  .rayo-r { width: 36%; height: 5%; right: -10%; top: 12%; transform: rotate(-27deg); opacity: .22; background: #010B9E; }

  .puntos {
    position: absolute; right: 0; top: 0; width: 26%; height: 45%;
    background-image: radial-gradient(#f81a1e 1.4px, transparent 1.4px);
    background-size: 1.1% 1.6%;
    -webkit-mask-image: linear-gradient(200deg, black 15%, transparent 62%);
    mask-image: linear-gradient(200deg, black 15%, transparent 62%);
    opacity: .35;
  }

  /* Logo arriba a la izquierda, SIN texto encima */
  .marca__caja {
    position: absolute;
    left: 3.85%; top: 8%;
    width: 15.5%;
    aspect-ratio: 1;
    border-radius: 4px;
    overflow: hidden;
    z-index: 3;
    box-shadow: 0 6px 14px rgba(0,0,0,.3);
  }
  .marca__caja img { width: 100%; height: 100%; object-fit: fill; display: block; }

  /* "Lojo" AHORA debajo del cuadrado del logo, no encima */
  .marca__texto {
    position: absolute;
    left: 3.85%; top: 39%;
    width: 15.5%;
    text-align: center;
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(10px, 1.7vw, 18px);
    color: #f81a1e;
    z-index: 3;
  }

  .titulo {
    position: absolute;
    left: 22%; top: 6%;
    width: 74%;
    z-index: 3;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 2%;
  }
  .titulo-texto h1 { line-height: .9; font-family: "Anton", "Arial Narrow", sans-serif; font-weight: 400; }
  .titulo-texto h1 .l1 {
    display: block;
    font-size: clamp(16px, 3.8vw, 42px);
    color: #010B9E;
    transform: skewX(-8deg);
    letter-spacing: .01em;
  }
  .titulo-texto h1 .l2 {
    display: block;
    font-size: clamp(22px, 5.4vw, 60px);
    color: #f81a1e;
    transform: skewX(-8deg);
    text-shadow: 0 3px 0 rgba(0,0,0,.15);
    margin-top: -1.5%;
    letter-spacing: .01em;
  }
  .titulo-texto p {
    margin-top: 1.4%;
    font-weight: 700;
    font-style: italic;
    color: #0b1f6b;
    font-size: clamp(8px, 1.35vw, 15px);
  }

  /* CASH LOJO pegado a la derecha del titulo, mismo tipo de letra (Anton) */
  .cabecera-marca {
    flex: 0 0 auto;
    text-align: right;
    padding-top: 1%;
  }
  .cabecera-marca span {
    display: block;
    font-family: "Anton", sans-serif;
    letter-spacing: .02em;
    line-height: .95;
  }
  .cabecera-marca .cash {
    color: #010B9E;
    font-size: clamp(30px, 7.2vw, 80px);
  }
  .cabecera-marca .lojo {
    color: #f81a1e;
    font-size: clamp(30px, 7.2vw, 80px);
  }

  .casilla {
    position: absolute;
    width: 15%;
    aspect-ratio: 1;
    top: 70%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #f81a1e;
    padding: 2.2%;
    box-shadow: 0 8px 16px rgba(0,0,0,.3);
    z-index: 3;
  }
  .casilla.c1 { left: 25%; }
  .casilla.c2 { left: 50%; }
  .casilla.c3 { left: 75%; }

  .casilla__reveal {
    position: absolute; inset: 2.2%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #eef1fb, #d7dbee);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .casilla__reveal img { width: 60%; height: auto; filter: drop-shadow(0 3px 6px rgba(0,0,0,.25)); }
  .casilla__capa {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border-radius: 50%;
    touch-action: none;
    cursor: pointer;
    transition: opacity .4s ease;
  }

  .pie {
    position: absolute;
    left: 50%; bottom: 5.5%;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 1.4%;
    z-index: 3;
    width: 60%;
    justify-content: center;
  }
  .pie .linea { width: 8%; height: 3px; background: #f81a1e; border-radius: 2px; }
  .pie span {
    font-weight: 800; color: #0b1f6b;
    font-size: clamp(9px, 1.5vw, 16px);
    white-space: nowrap;
  }

  /* --- Celebracion de premio: banner grande + confeti + fuegos --- */
  .celebracion {
    position: absolute; inset: 0;
    z-index: 20;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
    overflow: hidden;
  }
  .celebracion.visible { opacity: 1; }

  .celebracion__fondo {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(0,10,60,.15), rgba(0,10,60,.55));
  }

  .celebracion__banner {
    position: relative;
    z-index: 3;
    text-align: center;
    transform: scale(.4) rotate(-8deg);
    opacity: 0;
    transition: transform .55s cubic-bezier(.17,.89,.32,1.4), opacity .3s ease;
  }
  .celebracion.visible .celebracion__banner {
    transform: scale(1) rotate(-3deg);
    opacity: 1;
  }
  .celebracion__banner strong {
    display: block;
    font-family: "Anton", sans-serif;
    color: #fff;
    font-size: clamp(26px, 8vw, 90px);
    letter-spacing: .02em;
    text-shadow: 0 0 18px rgba(255,80,80,.9), 0 6px 0 #7a0000, 0 10px 24px rgba(0,0,0,.5);
    -webkit-text-stroke: 2px #7a0000;
  }
  .celebracion__banner span {
    display: block;
    margin-top: .6vh;
    font-weight: 800;
    font-family: "Poppins", sans-serif;
    color: #ffe9a8;
    font-size: clamp(11px, 2.4vw, 26px);
    text-shadow: 0 3px 8px rgba(0,0,0,.5);
  }

  .confeti-pieza {
    position: absolute;
    top: -8%;
    width: 1.6%;
    height: 3%;
    opacity: 0;
    z-index: 2;
  }
  .celebracion.visible .confeti-pieza {
    animation: caer-confeti linear forwards;
  }
  @keyframes caer-confeti {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 1; transform: translateY(128vh) rotate(540deg); }
  }

  .fuego {
    position: absolute;
    width: 2px; height: 2px;
    border-radius: 50%;
    z-index: 2;
  }
  .celebracion.visible .fuego {
    animation: estallar-fuego 1.1s ease-out forwards;
  }
  @keyframes estallar-fuego {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; }
  }

  .rotar-nota {
    display: flex; align-items: center; gap: 10px;
    color: #333c;
    font-size: clamp(11px, 1.8vh, 14px);
    font-weight: 600;
  }
  .rotar-nota svg { width: 22px; height: 22px; flex: none; }
  .rotar-nota svg.tel { width: 26px; height: 26px; }

  .rotar-aviso {
    display: none;
    position: fixed; inset: 0;
    background: linear-gradient(160deg, #12183a, #060a24);
    color: #cfd4ef;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 0 8vw;
    font-size: 15px;
    font-weight: 600;
    z-index: 50;
  }
  .rotar-aviso svg { width: 42px; height: 42px; }

  @media (orientation: portrait) {
    .mesa { display: none; }
    .rotar-aviso { display: flex; }
  }
</style>
</head>

        <canvas class="casilla__capa"></canvas>
      </div>

      <div class="pie">
        <div class="linea"></div>
        <span id="pie-texto">RASCA LAS 3 CASILLAS</span>
        <div class="linea"></div>
      </div>

      <div class="celebracion" id="celebracion">
        <div class="celebracion__fondo"></div>
        <div class="celebracion__banner">
          <strong>&iexcl;RASCA<br/>PREMIADO!</strong>
          <span>Ense&ntilde;alo en caja para recogerlo</span>
        </div>
      </div>
    </div>

    <div class="rotar-nota">
      <svg class="tel" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.8"><rect x="7" y="2" width="10" height="20" rx="2"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.8"><path d="M4 12a8 8 0 1 1 3 6.2M4 12v5h5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.8"><rect x="2" y="7" width="20" height="10" rx="2"/></svg>
      <span>Siempre se muestra en horizontal</span>
    </div>
  </div>

  <div class="rotar-aviso">
    <svg viewBox="0 0 24 24" fill="none" stroke="#f81a1e" stroke-width="1.8">
      <rect x="6" y="2" width="12" height="20" rx="2" transform="rotate(90 12 12)"/>
    </svg>
    <span>Gira el movil en horizontal<br/>para ver la tarjeta completa</span>
  </div>

<script>
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive: false });

  const pieTexto = document.getElementById('pie-texto');
  const celebracion = document.getElementById('celebracion');
  let terminadas = 0;

  function lanzarConfeti() {
    const colores = ['#f81a1e', '#010B9E', '#ffd75e', '#ffffff', '#7fc4fb'];
    for (let i = 0; i < 70; i++) {
      const pieza = document.createElement('i');
      pieza.className = 'confeti-pieza';
      pieza.style.left = (Math.random() * 100) + '%';
      pieza.style.background = colores[i % colores.length];
      pieza.style.borderRadius = (i % 3 === 0) ? '50%' : '2px';
      pieza.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
      pieza.style.animationDelay = (Math.random() * .5) + 's';
      celebracion.appendChild(pieza);
    }
  }

  function lanzarFuegos() {
    const colores = ['#ff5b5b', '#ffd75e', '#7fc4fb', '#ffffff', '#66e08a'];
    const centros = [[22, 30], [78, 25], [50, 55], [30, 70], [70, 68]];
    centros.forEach(([cx, cy], idx) => {
      window.setTimeout(() => {
        for (let i = 0; i < 22; i++) {
          const chispa = document.createElement('i');
          chispa.className = 'fuego';
          const angulo = (Math.PI * 2 * i) / 22;
          const distancia = 8 + Math.random() * 7;
          chispa.style.setProperty('--dx', (Math.cos(angulo) * distancia) + 'vw');
          chispa.style.setProperty('--dy', (Math.sin(angulo) * distancia) + 'vh');
          chispa.style.left = cx + '%';
          chispa.style.top = cy + '%';
          chispa.style.background = colores[(idx + i) % colores.length];
          chispa.style.boxShadow = `0 0 6px 2px ${colores[(idx + i) % colores.length]}`;
          celebracion.appendChild(chispa);
        }
      }, idx * 260);
    });
  }

  function iniciarCasillas() {
    document.querySelectorAll('.casilla').forEach((casilla) => {
      const canvas = casilla.querySelector('.casilla__capa');
      const ctx = canvas.getContext('2d');
      let revelada = false;
      let rascando = false;

      function ajustarTamano() {
        const rect = canvas.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;
        const ratio = window.devicePixelRatio || 1;
        canvas.width = rect.width * ratio;
        canvas.height = rect.height * ratio;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        pintarCapa(rect.width, rect.height);
      }

      function pintarCapa(w, h) {
        const cx = w/2, cy = h/2, r = w/2;
        const brillo = ctx.createLinearGradient(0, 0, w, h);
        brillo.addColorStop(0, '#e6e9f0');
        brillo.addColorStop(.35, '#c3c8d6');
        brillo.addColorStop(.65, '#9aa0b2');
        brillo.addColorStop(1, '#767d92');
        ctx.fillStyle = brillo;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,.4)';
        ctx.lineWidth = Math.max(1, w * 0.012);
        for (let x = -w; x < w * 2; x += w/9) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + w*0.5, h);
          ctx.stroke();
        }

        ctx.fillStyle = 'rgba(20,24,40,.5)';
        ctx.font = `800 ${Math.max(9, w * 0.15)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('RASCA', cx, cy);
      }

      function rascar(x, y, radio) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, radio, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }

      function porcentajeRascado() {
        const datos = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let transparentes = 0, total = 0;
        for (let i = 3; i < datos.length; i += 4 * 9) {
          total++;
          if (datos[i] === 0) transparentes++;
        }
        return transparentes / total;
      }

      function posicion(e) {
        const rect = canvas.getBoundingClientRect();
        const punto = e.touches ? e.touches[0] : e;
        return { x: punto.clientX - rect.left, y: punto.clientY - rect.top, radio: rect.width * 0.22 };
      }

      function comprobar() {
        if (revelada) return;
        if (porcentajeRascado() > 0.4) {
          revelada = true;
          canvas.style.opacity = '0';
          terminadas++;
          if (terminadas === 3) {
            pieTexto.textContent = 'HAS COMPLETADO LA TARJETA';
            celebracion.classList.add('visible');
            lanzarConfeti();
            lanzarFuegos();
          }
        }
      }

      function inicio(e) { e.preventDefault(); e.stopPropagation(); rascando = true; const p = posicion(e); rascar(p.x, p.y, p.radio); }
      function mover(e) { if (!rascando) return; e.preventDefault(); e.stopPropagation(); const p = posicion(e); rascar(p.x, p.y, p.radio); comprobar(); }
      function fin(e) { rascando = false; comprobar(); }

      canvas.addEventListener('mousedown', inicio);
      canvas.addEventListener('mousemove', mover);
      window.addEventListener('mouseup', fin);
      canvas.addEventListener('touchstart', inicio, { passive: false });
      canvas.addEventListener('touchmove', mover, { passive: false });
      canvas.addEventListener('touchend', fin, { passive: false });
      canvas.addEventListener('touchcancel', fin, { passive: false });

      // ResizeObserver: repinta si el tamano real cambia por CUALQUIER motivo
      // (carga tardia de la fuente Anton, cambio de barra de direcciones en
      // movil, giro de pantalla...). Antes solo se escuchaba "resize" de la
      // ventana, y en movil el canvas se quedaba con un tamano/posicion
      // desincronizado y no se rascaba bien.
      const observador = new ResizeObserver(() => ajustarTamano());
      observador.observe(canvas);

      ajustarTamano();
    });
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(iniciarCasillas);
  } else {
    iniciarCasillas();
  }
  window.addEventListener('load', () => {
    document.querySelectorAll('.casilla__capa').forEach(c => c.dispatchEvent(new Event('_noop')));
  });
</script>
